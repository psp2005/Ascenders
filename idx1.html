<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>악마 전투 시스템 - 성능 최적화본</title>
    <style>
        body { margin: 0; background-color: #2c3e50; overflow: hidden; width: 100vw; height: 100vh; }
        #player {
            width: 64px; height: 64px;
            background-image: url('demon_front_2.png');
            background-size: 256px 64px; background-repeat: no-repeat;
            image-rendering: pixelated; position: absolute; z-index: 10;
        }
        .walking { animation: walk-cycle 0.6s steps(4) infinite; }
        @keyframes walk-cycle { from { background-position: 0px 0px; } to { background-position: -256px 0px; } }

        /* 몬스터 애니메이션 */
        .enemy { width: 64px; height: 64px; background-size: 256px 64px; background-repeat: no-repeat; image-rendering: pixelated; position: absolute; z-index: 5; animation: monster-walk 0.6s steps(4) infinite; }
        @keyframes monster-walk { from { background-position: 0px 0px; } to { background-position: -256px 0px; } }
        .hp-bar-bg { position: absolute; width: 50px; height: 6px; background: rgba(0,0,0,0.5); top: -10px; left: 7px; }
        .hp-bar-fill { width: 100%; height: 100%; background: #ff4757; transition: width 0.1s; }

        /* 스킬 이펙트들 */
        .whip-vfx { width: 192px; height: 192px; position: absolute; background-size: 960px 192px; image-rendering: pixelated; pointer-events: none; z-index: 15; left: -64px; top: -64px; }
        .whip-animation { animation: play-whip 0.25s steps(5) forwards; }
        .scythe-swing { width: 64px; height: 64px; position: absolute; background-size: 256px 64px; image-rendering: pixelated; pointer-events: none; z-index: 12; animation: scythe-swing-anim 0.2s steps(4) forwards; }
        .scythe-effect-vfx { width: 512px; height: 512px; position: absolute; background-image: url('scythe_effect.png'); background-size: 2048px 512px; image-rendering: pixelated; pointer-events: none; z-index: 13; margin-left: -224px; margin-top: -224px; animation: effect-anim 0.5s steps(4) forwards; }
        
        @keyframes play-whip { from { background-position: 0px 0px; } to { background-position: -960px 0px; } }
        @keyframes scythe-swing-anim { from { background-position: 0px 0px; } to { background-position: -256px 0px; } }
        @keyframes effect-anim { from { background-position: 0px 0px; } to { background-position: -2048px 0px; } }

        /* 방향별 스타일 */
        .whip-vfx-front { background-image: url('demon_whisp_front.png'); }
        .whip-vfx-back { background-image: url('demon_whisp_back.png'); }
        .whip-vfx-left { background-image: url('demon_whisp_left_side.png'); }
        .whip-vfx-right { background-image: url('demon_whisp_right_side.png'); }
        .scythe-front { background-image: url('scythe_weapon_front.png'); left: -8px; top: 12px; }
        .scythe-back { background-image: url('scythe_weapon_back.png'); left: 8px; top: -12px; }
        .scythe-left { background-image: url('scythe_weapon_left.png'); left: -20px; top: 4px; }
        .scythe-right { background-image: url('scythe_weapon_right.png'); left: 20px; top: 4px; }
        .effect-front { transform: rotate(0deg) translateY(120px); }
        .effect-back { transform: rotate(180deg) translateY(120px); }
        .effect-left { transform: rotate(90deg) translateX(-120px) translateY(20px); }
        .effect-right { transform: rotate(-90deg) translateX(120px) translateY(20px); }

        /* 대시 VFX */
        .vfx { width: 64px; height: 64px; position: absolute; background-size: 256px 64px; image-rendering: pixelated; z-index: 20; }
        .vfx-start { background-image: url('demon_moving_start.png'); animation: play-vfx 0.4s steps(4) forwards; }
        .vfx-end { background-image: url('demon_moving_end.png'); animation: play-vfx 0.4s steps(4) forwards; }
        @keyframes play-vfx { from { background-position: 0px 0px; } to { background-position: -256px 0px; } }

        .hidden { visibility: hidden; }
        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* 중앙은 투명하고 가장자리로 갈수록 검은색이 되는 그라데이션 */
            background: radial-gradient(circle, transparent 50%, rgba(0, 0, 0, 0.8) 150%);
            pointer-events: none; /* 클릭이 캐릭터나 몬스터에게 전달되도록 설정 */
            z-index: 100; /* 가장 위에 표시 */
        }
    </style>
</head>
<body>
    <div id="player"></div>
    <div class="vignette"></div>
<script>
    const player = document.getElementById('player');
    const STATS = {
        speed: 4, dashDist: 240, enemySpeed: 1.2,
        whipRange: 130, whipDmg: 3, scytheRange: 260, scytheDmg: 1,
        stunTime: 500, spawnRate: 2500, maxEnemies: 8
    };

    let pos = { x: window.innerWidth/2, y: window.innerHeight/2 };
    let keys = {}, mouseButtons = {}, enemies = [];
    let isDashing = false, isAttacking = false, lastDir = 'front';

    window.addEventListener('contextmenu', e => e.preventDefault());
    window.addEventListener('keydown', e => { 
        keys[e.code] = true;
        if (e.code === 'Space' && !isDashing) dash(); // 스페이스바 대시 즉시 실행
    });
    window.addEventListener('keyup', e => keys[e.code] = false);
    window.addEventListener('mousedown', e => {
        mouseButtons[e.button] = true;
        if (!isAttacking && !isDashing) {
            if (e.button === 0) attackWhip();
            else if (e.button === 2) attackScythe();
        }
    });
    window.addEventListener('mouseup', e => mouseButtons[e.button] = false);

    // 몬스터 소환
    function spawnEnemy() {
        if (enemies.length >= STATS.maxEnemies) return;
        const eObj = {
            hp: 5, x: Math.random() < 0.5 ? -70 : window.innerWidth + 70, y: Math.random() * window.innerHeight,
            isStunned: false, el: document.createElement('div'), hpBar: document.createElement('div')
        };
        eObj.el.className = 'enemy'; eObj.el.style.backgroundImage = "url('alien.png')";
        const hpBg = document.createElement('div'); hpBg.className = 'hp-bar-bg';
        eObj.hpBar.className = 'hp-bar-fill'; hpBg.appendChild(eObj.hpBar);
        eObj.el.appendChild(hpBg); document.body.appendChild(eObj.el);
        enemies.push(eObj);
    }

    // 공격 판정 및 경직 처리
    function hitCheck(range, dmg, single = false) {
        let targets = enemies.map(e => {
            const dx = (e.x + 32) - (pos.x + 32), dy = (e.y + 32) - (pos.y + 32);
            return { e, dist: Math.sqrt(dx*dx + dy*dy) };
        }).filter(t => t.dist < range);

        if (single && targets.length > 0) {
            targets.sort((a,b) => a.dist - b.dist);
            applyDmg(targets[0].e, dmg);
        } else {
            targets.forEach(t => applyDmg(t.e, dmg));
        }
    }

    function applyDmg(e, dmg) {
        e.hp -= dmg; e.isStunned = true;
        e.el.style.filter = 'brightness(3) saturate(5)';
        setTimeout(() => { e.isStunned = false; e.el.style.filter = 'none'; }, STATS.stunTime);
        e.hpBar.style.width = Math.max(0, (e.hp/10)*100) + '%';
        if (e.hp <= 0) {
            e.el.remove();
            enemies = enemies.filter(item => item !== e);
        }
    }

    function attackWhip() {
        isAttacking = true;
        const vfx = document.createElement('div');
        vfx.className = `whip-vfx whip-animation whip-vfx-${lastDir}`;
        player.appendChild(vfx);
        hitCheck(STATS.whipRange, STATS.whipDmg, true);
        vfx.addEventListener('animationend', () => {
            vfx.remove(); isAttacking = false;
            if (mouseButtons[0] && !isDashing) attackWhip();
        }, {once:true});
    }

    function attackScythe() {
        isAttacking = true;
        const dir = lastDir;
        const sw = document.createElement('div'); sw.className = `scythe-swing scythe-${dir}`;
        const ef = document.createElement('div'); ef.className = `scythe-effect-vfx effect-${dir}`;
        ef.style.left = pos.x + 'px'; ef.style.top = pos.y + 'px';
        player.appendChild(sw); document.body.appendChild(ef);
        hitCheck(STATS.scytheRange, STATS.scytheDmg);
        sw.addEventListener('animationend', () => sw.remove());
        ef.addEventListener('animationend', () => {
            ef.remove(); isAttacking = false;
            if (mouseButtons[2] && !isDashing) attackScythe();
        }, {once:true});
    }

    function dash() {
        isDashing = true;
        let dx = 0, dy = 0;
        if (keys['KeyW']) dy -= 1; if (keys['KeyS']) dy += 1;
        if (keys['KeyA']) dx -= 1; if (keys['KeyD']) dx += 1;
        if (dx === 0 && dy === 0) { // 방향키 안눌렀을 때 보는 방향으로 대시
            if (lastDir === 'front') dy = 1; else if (lastDir === 'back') dy = -1;
            else if (lastDir === 'left') dx = -1; else dx = 1;
        }
        const len = Math.sqrt(dx*dx + dy*dy) || 1;
        const moveX = (dx/len) * STATS.dashDist, moveY = (dy/len) * STATS.dashDist;
        
        createVFX('vfx-start', pos.x, pos.y);
        player.classList.add('hidden');
        pos.x += moveX; pos.y += moveY;
        pos.x = Math.max(0, Math.min(window.innerWidth-64, pos.x));
        pos.y = Math.max(0, Math.min(window.innerHeight-64, pos.y));
        
        setTimeout(() => {
            player.style.left = pos.x + 'px'; player.style.top = pos.y + 'px';
            createVFX('vfx-end', pos.x, pos.y, () => {
                player.classList.remove('hidden'); isDashing = false;
            });
        }, 120);
    }

    function createVFX(type, x, y, cb) {
        const d = document.createElement('div'); d.className = `vfx ${type}`;
        d.style.left = x + 'px'; d.style.top = y + 'px';
        document.body.appendChild(d);
        d.addEventListener('animationend', () => { if(cb) cb(); d.remove(); }, {once:true});
    }

    // 메인 루프 (이동, 방향, 몬스터 추적 통합)
    function loop() {
        // 1. 플레이어 이동 및 방향 업데이트
        if (!isDashing) {
            let dx = 0, dy = 0;
            if (keys['KeyW']) { dy -= STATS.speed; lastDir = 'back'; }
            else if (keys['KeyS']) { dy += STATS.speed; lastDir = 'front'; }
            if (keys['KeyA']) { dx -= STATS.speed; lastDir = 'left'; }
            else if (keys['KeyD']) { dx += STATS.speed; lastDir = 'right'; }

            if (dx !== 0 && dy !== 0) { dx *= Math.SQRT1_2; dy *= Math.SQRT1_2; }
            pos.x += dx; pos.y += dy;
            pos.x = Math.max(0, Math.min(window.innerWidth-64, pos.x));
            pos.y = Math.max(0, Math.min(window.innerHeight-64, pos.y));
            
            player.style.left = pos.x + 'px'; player.style.top = pos.y + 'px';
            
            // 이미지 및 애니메이션 즉시 업데이트
            if (lastDir === 'front') player.style.backgroundImage = "url('demon_front_2.png')";
            else if (lastDir === 'back') player.style.backgroundImage = "url('demon_back_2.png')";
            else if (lastDir === 'left') player.style.backgroundImage = "url('demon_side.png')";
            else player.style.backgroundImage = "url('demon_right_side.png')";

            if (dx !== 0 || dy !== 0) player.classList.add('walking');
            else player.classList.remove('walking');
        }

        // 2. 몬스터 추적
        enemies.forEach(e => {
            if (e.isStunned) return;
            const edx = pos.x - e.x, edy = pos.y - e.y;
            const edist = Math.sqrt(edx*edx + edy*edy);
            if (edist > 10) {
                e.x += (edx/edist) * STATS.enemySpeed; e.y += (edy/edist) * STATS.enemySpeed;
                e.el.style.left = e.x + 'px'; e.el.style.top = e.y + 'px';
            }
        });

        requestAnimationFrame(loop);
    }

    setInterval(spawnEnemy, STATS.spawnRate);
    loop();
</script>
</body>
</html>
